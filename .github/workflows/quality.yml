name: Editorial quality checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check distinct topic advice and references
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const guide = JSON.parse(await readFile('src/launch-content.json','utf8'));
          assert(guide.checks.length >= 6, 'Six distinct on-page checks required');
          assert(guide.checks.every(x => x.tip.length >= 65), 'Every check needs a substantive caution');
          assert(new Set(guide.checks.map(x => x.tip)).size === guide.checks.length, 'Avoid repeated boilerplate');
          assert(guide.fieldGuide.scenarios.length >= 4,'Four useful original source-bound examples required');
          for(const s of guide.fieldGuide.scenarios) {
            for(const k of ['title','action','avoid','verify'])
              assert(s[k]?.length >= 18,'Scenario missing useful ' + k);
          }
          assert(guide.references.length >= 2,'Keep external first-party verification sources');
          assert(guide.references.every(x=>x.label.length>8&&x.url.startsWith('https://')),'Named HTTPS sources required');
          console.log('Validated '+guide.checks.length+' distinct cautions, '+guide.fieldGuide.scenarios.length+' scenarios and '+guide.references.length+' sources');
          NODE
      - run: npm run build
